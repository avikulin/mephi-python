[project]
name = "dz-catalog-analysis-vikulin-m25-555"
version = "0.1.0"
description = "Homework#1. Movies catalog analysis"
readme = "README.md"
authors = [
    { name = "Andrey Vikulin", email = "asvikulin@mail.ru" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
catalog-analysis = "catalog_analysis:main"
demo = "catalog_analysis.demo.__main__:main"

[tool.uv.build-backend]
module-name = "catalog_analysis"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
